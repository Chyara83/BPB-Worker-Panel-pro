name: Prepare BPB 4.5.0 User Management

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save Wrangler configuration
        run: cp wrangler.jsonc /tmp/wrangler.jsonc

      - name: Fetch BPB 4.5.0 tag
        run: |
          git fetch --tags https://github.com/javadSharifi/BPB-Worker-Panel-pro.git
          git checkout -b production-users 4.5.0

      - name: Restore Wrangler configuration
        run: |
          cp /tmp/wrangler.jsonc wrangler.jsonc

      - name: Commit Wrangler configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit -m "Add Wrangler configuration for Cloudflare" || true

      - name: Push production branch
        run: |
          git push origin production-users
